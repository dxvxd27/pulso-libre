<style>
/* Layout: one-column stage app; tab bar pinned to the bottom like a phone app, metronome view as the hero. */
:root {
  --bg: #E9ECF1;
  --surface: #FFFFFF;
  --surface-2: #F3F5F8;
  --ink: #141821;
  --muted: #5B6272;
  --line: #D3D8E1;
  --led: #C77700;
  --led-soft: #F4D9A8;
  --led-ink: #1B1200;
  --danger: #B3261E;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F131A; --surface: #181E28; --surface-2: #202835; --ink: #ECEFF4; --muted: #98A1B3;
    --line: #2C3545; --led: #F5A623; --led-soft: #4A3713; --led-ink: #1B1200; --danger: #F2827A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F131A; --surface: #181E28; --surface-2: #202835; --ink: #ECEFF4; --muted: #98A1B3;
  --line: #2C3545; --led: #F5A623; --led-soft: #4A3713; --led-ink: #1B1200; --danger: #F2827A;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; overscroll-behavior: none; }
img { max-width: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
/* iPhone: no double-tap zoom, no text selection or callout while tapping fast. */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
button, canvas { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(84px + env(safe-area-inset-bottom, 0px)); }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; }
.brand span { color: var(--led); }
.chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; background: var(--surface); }
button.chip { padding: 6px 12px; }
.chip.ok::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #2E9E5B; margin-right: 6px; vertical-align: 1px; }
.chip.local::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--led); margin-right: 6px; vertical-align: 1px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
/* Paint the tab bar's color past its bottom edge: in the installed iPhone app iOS can end the page
   a little above the screen edge, and this keeps that strip the same color as the bar. */
nav.tabs::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 160px; background: var(--surface); }
html { background: var(--surface); }
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { background: none; border: 0; padding: 12px 4px 14px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"] svg { color: var(--led); }

h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: 28px; margin: 4px 0 12px; text-wrap: balance; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.btn.primary { background: var(--led); border-color: var(--led); color: var(--led-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }

input[type=text], input[type=number], input[type=search], select {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; min-width: 0;
  font-size: 16px; /* under 16px, iPhone zooms in when the field is focused */ }
input[type=range] { width: 100%; accent-color: var(--led); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

/* Metronome */
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.now { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.now .title { font-weight: 700; font-size: 18px; line-height: 1.2; overflow-wrap: anywhere; }
.beats { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 6px; }
.beat { height: 46px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); position: relative; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.beat i { display: block; background: var(--muted); opacity: .35; transition: none; }
.beat[data-l="2"] i { height: 100%; }
.beat[data-l="1"] i { height: 55%; }
.beat[data-l="0"] i { height: 0; }
.beat b { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500; }
.beat.on i { background: var(--led); opacity: 1; }
.beat.on[data-l="0"] { border-color: var(--led); }
.bpm-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.bpm { text-align: center; }
.wheel { display: block; width: 100%; height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); touch-action: none; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
.wheel.small { height: 38px; border-radius: 10px; }
.wheel.dragging { border-color: var(--ink); }
.bpm .num { font-family: var(--display); font-weight: 800; font-size: clamp(68px, 19vw, 96px); line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* Compact live screen: everything you touch while playing fits in one phone screen. */
.metro { display: flex; flex-direction: column; gap: 14px; }
.metro .beats .beat { height: 38px; }
.setpanel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sp-head { display: flex; gap: 8px; align-items: center; padding: 9px 14px; background: var(--surface-2); font-size: 14px; border-bottom: 1px solid var(--line); }
.sp-head b { font-weight: 700; }
.sp-list { max-height: 168px; overflow-y: auto; position: relative; }
.sp-row { display: flex; width: 100%; gap: 10px; justify-content: space-between; align-items: center; min-height: 42px; padding: 8px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-size: 15px; }
.sp-row:first-child { border-top: 0; }
.sp-row .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-row .mono { color: var(--muted); white-space: nowrap; flex: none; }
.sp-row.active { background: var(--led-soft); font-weight: 700; }
.sp-row.active .mono { color: var(--ink); }
.setpanel .ramp { border-radius: 0; height: 3px; }
.songcard { display: flex; flex-direction: column; gap: 2px; padding: 2px; }
.songcard .title { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.center { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 8px; }
.side { width: 64px; height: 64px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; font-size: 28px; font-weight: 600; position: relative; }
.side svg { width: 26px; height: 26px; }
.side:disabled { opacity: .35; cursor: default; }
.side.dirty::after { content: ""; position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--led); }
.tempo-name { font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
.ramplbl { font-size: 12px; color: var(--muted); text-align: center; min-height: 1.3em; margin-top: -10px; }
.transrow { display: grid; grid-template-columns: auto 1fr 64px; gap: 10px; align-items: center; }
.transrow .mono { text-align: right; }
.metro .tap { font-size: 18px; }
.bpm .num.ramping { color: var(--led); }
.bpm .unit { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--muted); }
.step { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font-size: 26px; font-weight: 600; line-height: 1; }
.meter { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; }
.transport { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; }
.play { height: 64px; border-radius: 14px; border: 0; background: var(--led); color: var(--led-ink); font-family: var(--display); font-size: 26px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
.play svg { width: 22px; height: 22px; }
.tap { height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.tap:active { background: var(--led-soft); }

.setbar { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.ramp { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.ramp i { display: block; height: 100%; width: 0; background: var(--led); }
.trans-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.trans-pick button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.trans-pick button[aria-pressed="true"] { background: var(--led); border-color: var(--led); color: var(--led-ink); }
.upnext { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.upnext .t { font-weight: 700; overflow-wrap: anywhere; }
.mono { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }

/* Lists */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .main { min-width: 0; background: none; border: 0; text-align: left; padding: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { font-size: 13px; color: var(--muted); }
.item.active { background: var(--led-soft); }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); }
.example { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--led); margin-left: 6px; }

.set-item { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.set-item:first-child { border-top: 0; }
.set-item .n { font-family: var(--mono); color: var(--muted); font-size: 13px; text-align: right; }
.set-item .ctr { display: flex; gap: 4px; }
.trans-row { display: flex; align-items: center; gap: 8px; padding: 6px 12px 10px 50px; font-size: 13px; color: var(--muted); }
.trans-row input { width: 72px; padding: 5px 8px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.slot { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 60; font-size: 14px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

function applyDrag(c) {
  const key = drag.key; const pps = pxPerStep(key, c);
  const n = Math.trunc(drag.acc / pps);

    const before = WHEELS[key].value();
    drag.acc -= n * pps; WHEELS[key].step(n);
    if (WHEELS[key].value() === before) { drag.acc = 0; drag.v = 0; } // hit the end of the range
  }

document.addEventListener("pointerdown", e => {

    <div class="field"><span class="label">Título</span><input id="e-title" type="text" value="${esc(edit.title)}" placeholder="Nombre de la canción"></div>
    <div class="grid2">
      <div class="field"><span class="label">Artista (opcional)</span><input id="e-artist" type="text" value="${esc(edit.artist || "")}"></div>
      <div class="field"><span class="label">BPM</span><input id="e-bpm" type="number" min="20" max="300" value="${edit.bpm}"></div>
    </div>
    <div class="grid3">${meterControls("e-", edit.beats, edit.unit, edit.sub)}</div>
    <div class="field"><span class="label">Acentos · toca para cambiar</span><div class="beats" id="e-acc" style="--n:${edit.beats}">${beatCells(edit.accents, -1)}</div></div>
    <div class="row">
      <button class="btn primary grow" data-act="save-sheet">Guardar</button>
      <button class="btn" data-act="close-sheet-btn">Cancelar</button>
      ${edit.id ? (UI.confirm === "song:" + edit.id ? `<button class="btn danger" data-act="del-song">Sí, borrar</button>` : `<button class="btn danger" data-act="ask-del-song">Borrar</button>`) : ""}
    </div>
  </div></div>`;
  setTimeout(() => { if (!edit.id) $("#e-title")?.focus(); }, 30);
}
function readSheet() {
  edit.title = $("#e-title").value.trim(); edit.artist = $("#e-artist").value.trim();
  edit.bpm = clamp(parseInt($("#e-bpm").value, 10) || 120, 20, 300);
}

/* ---------- Events ---------- */
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (b) { UI.confirm = null; switchTab(b.dataset.tab); }
});

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "close-sheet" && e.target !== el) return;
  switch (act) {
    case "toggle": if (e.detail === 0) { E.playing ? stop() : await start(); } break; // keyboard; touches go through pointerup
    case "tap": if (e.detail === 0) tap(); break; // keyboard; touches and clicks count on pointerdown
    case "minus": setBpm(M.bpm - 1); break;
    case "plus": setBpm(M.bpm + 1); break;
    case "cycle": {
      const i = +el.dataset.i;
      const inSheet = !!el.closest(".sheet");
      const arr = inSheet ? edit.accents : M.accents;
      arr[i] = arr[i] === 2 ? 1 : arr[i] === 1 ? 0 : 2;
      el.dataset.l = arr[i];
      if (!inSheet) { M.dirty = !!M.songId; const sv = $("#savebtn"); if (sv) sv.disabled = false; }
      break;
    }
    case "save-song": {
      const s = songById(M.songId); if (!s) break;
      const { id, ...rest } = s;
      await Store.put("songs", id, { ...rest, bpm: M.bpm, beats: M.beats, unit: M.unit, sub: M.sub, accents: M.accents.slice() });
      M.dirty = false; toast("Canción actualizada"); renderMetro(); break;
    }
    case "more": UI.more = true; renderMore(); break;
    case "save-new": UI.more = false; openSongSheet({ id: null, title: "", artist: "", bpm: M.bpm, beats: M.beats, unit: M.unit, sub: M.sub, accents: M.accents.slice() }); break;
    case "prev": goTo(SET.index - 1, curTrans()); break;
    case "next": goTo(SET.index + 1, curTrans()); break;
    case "jump": goTo(+el.dataset.i, curTrans()); break;
    case "exit-set": SET.id = null; UI.more = false; renderSheet(); renderMetro(); break;
    case "trans": SET.trans = +el.dataset.s; updateTransUI(); break;

    case "new-song": openSongSheet(null); break;
    case "edit-song": openSongSheet(songById(el.dataset.id)); break;
    case "load-song": {
      const s = songById(el.dataset.id); if (!s) break;
      SET.id = null;
      changeSong(s, 0);
      switchTab("metro"); break;
    }
    case "close-sheet": case "close-sheet-btn": edit = null; UI.more = false; UI.account = false; UI.confirm = null; renderSheet(); break;
    case "account": UI.more = false; edit = null; UI.account = true; renderAccount(); setTimeout(() => $("#acc-email")?.focus(), 30); break;
    case "sync-now": Store.sync(); break;
    case "logout": Store.signOut(); renderAccount(); toast("Sesión cerrada. Lo guardado sigue en este móvil."); break;
    case "save-sheet": {
      readSheet();
      if (!edit.title) { $("#e-title").focus(); toast("Ponle un título a la canción"); break; }
      const id = edit.id || uid();
      const prev = edit.id ? songById(edit.id) : null;
      const data = { title: edit.title, artist: edit.artist, bpm: edit.bpm, beats: edit.beats, unit: edit.unit, sub: edit.sub, accents: edit.accents.slice(), createdAt: prev?.createdAt || Date.now() };
      await Store.put("songs", id, data);
      if (M.songId === id || (!edit.id && !M.songId)) { applySong({ id, ...data }); }
      edit = null; renderSheet(); toast("Canción guardada"); render(); break;
    }
    case "ask-del-song": UI.confirm = "song:" + edit.id; readSheet(); renderSheet(); break;
    case "del-song": {
      const id = edit.id; edit = null; UI.confirm = null; renderSheet();
      for (const sl of Store.setlists) {
        if ((sl.items || []).some(it => it.songId === id)) {
          const { id: sid, ...rest } = sl;
          await Store.put("setlists", sid, { ...rest, items: rest.items.filter(it => it.songId !== id) });
        }
      }
      await Store.del("songs", id);
      if (M.songId === id) { M.songId = null; M.dirty = false; }
      toast("Canción borrada"); render(); break;
    }

    case "new-set": {
      const id = uid();
      await Store.put("setlists", id, { name: "Nueva setlist", items: [], createdAt: Date.now() });
      UI.openSet = id; renderSets(); setTimeout(() => $("#set-name")?.select(), 30); break;
    }
    case "open-set": UI.openSet = el.dataset.id; UI.confirm = null; UI.addQuery = ""; renderSets(); break;
    case "close-set": UI.openSet = null; UI.confirm = null; renderSets(); break;
    case "play-set": playSetlist(el.dataset.id); break;
    case "add-to-set": case "mv": case "rm": {
      const sl = Store.setlists.find(s => s.id === UI.openSet); if (!sl) break;
      const items = (sl.items || []).map(x => ({ ...x }));
      if (act === "add-to-set") {
        const v = el.dataset.id; if (!v) break;
        items.push({ songId: v, trans: 4 });
        UI.addQuery = ""; toast("Añadida: " + (songById(v)?.title || "canción"));
      }
      else if (act === "rm") items.splice(+el.dataset.i, 1);
      else { const i = +el.dataset.i, j = i + +el.dataset.d; [items[i], items[j]] = [items[j], items[i]]; }
      const { id, ...rest } = sl;
      await Store.put("setlists", id, { ...rest, items });
      break;
    }
    case "ask-del-set": UI.confirm = "set:" + el.dataset.id; renderSets(); break;
    case "del-set": {
      const id = el.dataset.id; UI.confirm = null; UI.openSet = null;
      if (SET.id === id) SET.id = null;
      await Store.del("setlists", id); toast("Setlist borrada"); renderSets(); break;
    }
    case "cancel-confirm": UI.confirm = null; render(); if (edit) renderSheet(); break;

    case "preview-slot": { audio(); const c = cfg(); const k = el.dataset.k; const b = await getBuffer(c[k].sound); playBuf(b, c[k].vol, ctx.currentTime + 0.01); break; }
    case "preview": { audio(); const b = await getBuffer(el.dataset.id); playBuf(b, 1, ctx.currentTime + 0.01); break; }
    case "ask-del-sound": UI.confirm = "snd:" + el.dataset.id; renderSounds(); break;
    case "del-sound": {
      const id = el.dataset.id; UI.confirm = null;
      const c = cfg(); let changed = false;
      for (const k of ["accent", "beat", "sub"]) if (c[k].sound === id) { c[k].sound = DEFAULT_CONFIG[k].sound; changed = true; }
      if (changed) await Store.saveConfig(c);
      await Store.del("sounds", id); buffers.delete(id); toast("Sonido borrado"); renderSounds(); break;
    }
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "bpmrange") setBpm(+t.value);
  else if (t.id === "add-search") {
    UI.addQuery = t.value;
    const sl = Store.setlists.find(s => s.id === UI.openSet), box = $("#add-results");
    if (sl && box) box.innerHTML = addResultsHtml(sl);
  }
  else if (t.id === "search") { UI.search = t.value; const q = t.value.trim().toLowerCase(); $("#songlist").innerHTML = songListHtml(sortedSongs().filter(s => !q || (s.title || "").toLowerCase().includes(q) || (s.artist || "").toLowerCase().includes(q))); }
});

let volTimer;
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "m-beats" || t.id === "m-unit" || t.id === "m-sub") {
    M.beats = +$("#m-beats").value; M.unit = +$("#m-unit").value; M.sub = +$("#m-sub").value;
    M.accents = fixAccents(M.accents, M.beats); M.dirty = !!M.songId;
    if (E.beat >= M.beats) E.beat = 0;
    if (E.subI >= M.sub) E.subI = 0;
    renderMetro();
  } else if (t.id === "e-beats" || t.id === "e-unit" || t.id === "e-sub") {
    readSheet();
    edit.beats = +$("#e-beats").value; edit.unit = +$("#e-unit").value; edit.sub = +$("#e-sub").value;
    edit.accents = fixAccents(edit.accents, edit.beats); renderSheet();
  } else if (t.id === "trans-custom") {
    SET.trans = clamp(parseInt(t.value, 10) || 0, 0, 120); renderMetro();
  } else if (t.id === "set-name") {
    const sl = Store.setlists.find(s => s.id === UI.openSet); if (!sl) return;
    const { id, ...rest } = sl; await Store.put("setlists", id, { ...rest, name: t.value.trim() || "Sin nombre" });
  } else if (t.dataset.trans !== undefined) {
    const sl = Store.setlists.find(s => s.id === UI.openSet); if (!sl) return;
    const items = (sl.items || []).map(x => ({ ...x }));
    items[+t.dataset.trans].trans = clamp(Math.round((parseFloat(String(t.value).replace(",", ".")) || 0) * 2) / 2, 0, 12);
    const { id, ...rest } = sl; await Store.put("setlists", id, { ...rest, items });
  } else if (t.id.startsWith("slot-") || t.id.startsWith("vol-")) {
    const c = cfg();
    for (const k of ["accent", "beat", "sub"]) { c[k].sound = $("#slot-" + k).value; c[k].vol = +$("#vol-" + k).value; }
    clearTimeout(volTimer);
    volTimer = setTimeout(async () => { await Store.saveConfig(c); if (ctx) await loadSlots(); }, 250);
  } else if (t.id === "upload" && t.files && t.files[0]) {
    const f = t.files[0]; t.value = "";
    try {
      toast("Procesando sonido…");
      const snd = await fileToSound(f);
      const name = f.name.replace(/\.[^.]+$/, "").slice(0, 60) || "Sonido";
      await Store.put("sounds", uid(), { name, ...snd, createdAt: Date.now() });
      toast("Sonido guardado: " + name);
    } catch (err) {
      toast(err?.message === "silent" ? "El archivo está en silencio." : "No se pudo leer ese archivo de audio. Prueba con WAV o MP3.");
    }
  }
});

document.addEventListener("keydown", e => {
  const wk = e.target.dataset?.wheel;
  if (wk && /^Arrow/.test(e.key)) {
    e.preventDefault();
    WHEELS[wk].step(e.key === "ArrowUp" || e.key === "ArrowRight" ? 1 : -1);
    return;
  }
  if (e.target.matches("input, select, textarea")) return;
  if (e.code === "Space" && tab === "metro") { e.preventDefault(); E.playing ? stop() : start(); }
  if (e.key === "Escape" && (edit || UI.more)) { edit = null; UI.more = false; renderSheet(); }
});

/* ---------- Data changes ---------- */
Store.onChange(what => {
  if (what === "sounds" || what === "config") { buffers.forEach((_, k) => { if (!k.startsWith("b:")) buffers.delete(k); }); if (ctx) loadSlots(); }
  if (what === "songs" && M.songId && !M.dirty && !E.playing) { const s = songById(M.songId); if (s) applySong(s); }
  if (edit && what !== "config") return; // keep the editor steady
  if (tab === "metro" && (what === "songs" || what === "setlists")) renderMetro();
  else if (tab === "lib" && what === "songs") renderLib();
  else if (tab === "sets" && (what === "songs" || what === "setlists")) renderSets();
  else if (tab === "sounds" && (what === "sounds" || what === "config")) renderSounds();
});

try { const t = localStorage.getItem("pulsolibre-tab"); if (t && ["metro", "lib", "sets", "sounds"].includes(t)) tab = t; } catch {}
switchTab(tab);
document.addEventListener("submit", async e => {
  if (e.target.id !== "login-form") return;
  e.preventDefault();
  const btn = $("#acc-submit"), err = $("#acc-err");
  btn.disabled = true; btn.textContent = "Entrando…"; err.textContent = "";
  try {
    await Store.signIn($("#acc-email").value.trim(), $("#acc-pass").value);
    renderAccount(); toast("Sesión iniciada");
  } catch (ex) {
    err.textContent = !navigator.onLine ? "Necesitas conexión para iniciar sesión." : ex.status === 400 ? "Correo o contraseña incorrectos." : "No se pudo iniciar sesión. Inténtalo otra vez.";
    btn.disabled = false; btn.textContent = "Entrar";
  }
});

Store.init();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}));
  // When a new version takes over, reload once to show it, unless the metronome is playing.
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadSW || reloaded || E.playing) return;
    reloaded = true; location.reload();
  });
}
})();
</script>
</body>
</html>
